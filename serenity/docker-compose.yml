services:
  model-server:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        REQUIREMENTS: requirements-model.txt
        TORCH_INDEX_URL: ${SERENITY_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    command: uvicorn backend.model_server:app --host 0.0.0.0 --port 8001
    environment:
      PYTHONPATH: /app/serenity
      SERENITY_MODEL_DIR: /app/serenity/models/mental_health_llm
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-none}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    ports:
      - "${SERENITY_MODEL_PORT:-8001}:8001"
    volumes:
      - ./:/app/serenity

  stt-server:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        REQUIREMENTS: requirements-stt.txt
        TORCH_INDEX_URL: ${SERENITY_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    command: uvicorn backend.stt_server:app --host 0.0.0.0 --port 8002
    environment:
      PYTHONPATH: /app/serenity
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-none}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    ports:
      - "${SERENITY_STT_PORT:-8002}:8002"
    volumes:
      - ./:/app/serenity

  tts-server:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        REQUIREMENTS: requirements-tts.txt
        TORCH_INDEX_URL: ${SERENITY_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    command: uvicorn backend.tts_server:app --host 0.0.0.0 --port 8003
    environment:
      PYTHONPATH: /app/serenity
    ports:
      - "${SERENITY_TTS_PORT:-8003}:8003"
    volumes:
      - ./:/app/serenity

  vad-server:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        REQUIREMENTS: requirements-vad.txt
        TORCH_INDEX_URL: ${SERENITY_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    command: uvicorn backend.vad_server:app --host 0.0.0.0 --port 8004
    environment:
      PYTHONPATH: /app/serenity
    ports:
      - "${SERENITY_VAD_PORT:-8004}:8004"
    volumes:
      - ./:/app/serenity

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        REQUIREMENTS: requirements.txt
        TORCH_INDEX_URL: ${SERENITY_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - model-server
      - stt-server
      - tts-server
      - vad-server
    environment:
      PYTHONPATH: /app/serenity
      SERENITY_MODEL_SERVER_URL: http://model-server:8001
      SERENITY_STT_SERVER_URL: http://stt-server:8002
      SERENITY_TTS_SERVER_URL: http://tts-server:8003
      SERENITY_VAD_SERVER_URL: http://vad-server:8004
      SERENITY_DATABASE_URL: sqlite:////app/serenity/serenity.db
      SERENITY_CORS_ORIGINS: ${SERENITY_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "${SERENITY_BACKEND_PORT:-8000}:8000"
    volumes:
      - ./:/app/serenity

  # Data prep and fine-tuning. Held behind a profile so it never starts with the
  # stack; run it explicitly:
  #   docker compose --profile training run --rm trainer python scripts/download_data.py
  #   docker compose --profile training run --rm trainer python scripts/finetune.py
  trainer:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        REQUIREMENTS: requirements-data.txt
        TORCH_INDEX_URL: ${SERENITY_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    profiles:
      - training
    environment:
      PYTHONPATH: /app/serenity
      HF_HOME: /app/serenity/data/cache/huggingface
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-none}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    volumes:
      - ./:/app/serenity
    command: ["python", "scripts/download_data.py"]

  # GPU variant of the trainer. Kept as its own service because a device
  # reservation makes a service unstartable on machines without an NVIDIA GPU,
  # and because it needs CUDA torch wheels rather than the CPU default.
  #
  # cu121 (torch 2.5.x) is the default: it still ships sm_75 kernels, which
  # Turing cards such as the RTX 2060 need, and newer drivers run it fine.
  # Override SERENITY_CUDA_INDEX_URL for a newer toolkit on newer hardware.
  #
  #   docker compose --profile training-gpu run --rm trainer-gpu python scripts/finetune.py
  trainer-gpu:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        REQUIREMENTS: requirements-data.txt
        TORCH_INDEX_URL: ${SERENITY_CUDA_INDEX_URL:-https://download.pytorch.org/whl/cu121}
    profiles:
      - training-gpu
    environment:
      PYTHONPATH: /app/serenity
      HF_HOME: /app/serenity/data/cache/huggingface
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./:/app/serenity
    command: ["python", "scripts/finetune.py"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - backend
    environment:
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8000}
    ports:
      - "${SERENITY_FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
